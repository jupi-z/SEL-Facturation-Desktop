{% extends 'base.html' %}{% block body %}<section class="panel"><div class="sectionhead"><div><div class="eyebrow">NOUVEAU DÉCOMPTE</div><h2>Nouveau décompte de consommation</h2><p class="sub">La facture sera créée uniquement après vérification de la prévisualisation.</p></div><span class="pill">USD · TVA 16 %</span></div>
<form method="post" class="form" data-draft-key="invoice-new" data-draft-server="{{ 'true' if draft else 'false' }}"><input type="hidden" name="_csrf" value="{{ csrf() }}"><div class="fields cols3"><label class="wide" for="client_id">Abonné<select id="client_id" name="client_id" required><option value="">Sélectionner…</option>{% for c in clients %}<option value="{{ c['id'] }}" {{ 'selected' if draft.get('client_id','')|string == c['id']|string else '' }}>{{ c['code'] }} — {{ c['name'] }} — {{ c['customer_type'] or 'Type à définir' }}</option>{% endfor %}</select></label><label for="billing_period">Période (mois)<input id="billing_period" type="month" name="billing_period" value="{{ draft.get('billing_period', period) }}" required></label><label for="consumption_kwh">Consommation (kWh)<input id="consumption_kwh" type="number" step="0.001" min="0" name="consumption_kwh" value="{{ draft.get('consumption_kwh','') }}" required placeholder="100"></label><label for="due_date">Date limite de paiement<input id="due_date" type="date" name="due_date" value="{{ draft.get('due_date','') }}"></label><label class="wide" for="note">Observation<input id="note" name="note" maxlength="500" value="{{ draft.get('note','') }}" placeholder="Optionnel"></label></div><button class="primary" type="submit" {% if not configured or not clients %}disabled{% endif %}>Prévisualiser le décompte</button></form></section><p class="note">Facturation mensuelle selon la consommation saisie en kWh.</p>{% endblock %}
