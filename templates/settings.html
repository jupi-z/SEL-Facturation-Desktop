{% extends 'base.html' %}
{% block body %}
<section class="panel"><div class="sectionhead"><h2>Paramètres de facturation</h2></div><p class="notice-warning">Les tarifs affichés initialement ne sont qu'une transcription de la facture d'exemple. Confirmez le barème réel, les taxes et leur assiette avec SEL avant d'activer l'émission.</p>
<form method="post" class="form"><input type="hidden" name="_csrf" value="{{ csrf() }}">
  <fieldset><legend>Identité SEL</legend><div class="fields cols3"><label for="company_name">Dénomination<input id="company_name" name="company_name" value="{{ settings['company_name'] }}"></label><label for="tagline">Signature<input id="tagline" name="tagline" value="{{ settings['tagline'] }}"></label><label for="address">Adresse<input id="address" name="address" value="{{ settings['address'] }}"></label><label for="phone">Téléphone<input id="phone" name="phone" value="{{ settings['phone'] }}"></label><label for="email">Email<input id="email" name="email" value="{{ settings['email'] }}"></label><label for="website">Site web<input id="website" name="website" value="{{ settings['website'] }}"></label><label for="rccm">RCCM<input id="rccm" name="rccm" value="{{ settings['rccm'] }}"></label><label for="nif">NIF / numéro d’impôt<input id="nif" name="nif" value="{{ settings['nif'] }}"></label><label for="id_nat">Identification nationale<input id="id_nat" name="id_nat" value="{{ settings['id_nat'] }}"></label></div></fieldset>
  <fieldset><legend>Barème et taxes</legend><div class="fields cols3"><label for="tiers" class="wide">Tranches <span class="sub">Une par ligne : 1-100:300, 101-200:320, 201-:350</span><textarea id="tiers" name="tiers" rows="5" required>{{ settings['tiers'] }}</textarea></label><label for="local_rate">Taux taxe locale (%)<input id="local_rate" name="local_rate" value="{{ settings['local_rate'] }}" required></label><label for="vat_rate">Taux TVA (%)<input id="vat_rate" name="vat_rate" value="{{ settings['vat_rate'] }}" required></label><label for="vat_base">Assiette de TVA<select id="vat_base" name="vat_base"><option value="ENERGY" {{ 'selected' if settings['vat_base']=='ENERGY' else '' }}>Énergie uniquement</option><option value="ENERGY_LOCAL" {{ 'selected' if settings['vat_base']=='ENERGY_LOCAL' else '' }}>Énergie + taxe locale</option><option value="ENERGY_LOCAL_FEES" {{ 'selected' if settings['vat_base']=='ENERGY_LOCAL_FEES' else '' }}>Énergie + taxe locale + frais</option></select></label><label for="currency">Devise<input id="currency" name="currency" maxlength="3" value="{{ settings['currency'] }}" required></label></div></fieldset>
  <label class="check"><input type="checkbox" name="confirmed" value="yes" required> J'ai obtenu confirmation auprès de SEL que ces tarifs, taxes et règles de calcul sont effectivement applicables.</label><button class="primary" type="submit">Valider et enregistrer les paramètres</button>
</form></section>
{% endblock %}
