{% extends 'base.html' %}{% block body %}<section class="auth-form" aria-labelledby="setup-title"><div class="eyebrow">PREMIÈRE UTILISATION</div><h2 id="setup-title">Sécuriser ce poste SEL</h2><p class="auth-intro">Créez le mot de passe qui protégera les données enregistrées sur cet ordinateur.</p><div class="auth-hint">Utilisez au moins 10 caractères et conservez ce mot de passe dans un endroit sûr.</div><form method="post" class="form"><input type="hidden" name="_csrf" value="{{ csrf() }}"><label for="password">Mot de passe administrateur<div class="password-field"><input id="password" type="password" name="password" minlength="10" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Afficher le mot de passe">Afficher</button></div></label><label for="confirm">Confirmer le mot de passe<div class="password-field"><input id="confirm" type="password" name="confirm" minlength="10" required autocomplete="new-password"><button type="button" class="password-toggle" data-password-toggle="confirm" aria-label="Afficher la confirmation du mot de passe">Afficher</button></div></label><button class="primary auth-submit" type="submit">Créer le compte</button></form></section>{% endblock %}
