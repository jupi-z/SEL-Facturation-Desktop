[workspace]
resolver = "2"
members = [
  "crates/sel-domain",
  "crates/sel-contracts",
  "crates/sel-storage",
  "crates/sel-sync",
  "crates/sel-api",
  "crates/sel-local",
  "crates/sel-cli",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
http = "1.1"
http-body-util = "0.1"
jsonwebtoken = "9.3"
rand = "0.8"
rpassword = "7.5.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "macros", "uuid", "chrono", "rust_decimal", "json"] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["request-id", "trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "=1.10.0", features = ["serde", "v4", "v5", "v7"] }
utoipa = { version = "5.3", features = ["axum_extras", "yaml", "uuid", "chrono"] }
url = "2.5"

