openapi: 3.1.0
info:
  title: SEL V2 Backend API
  version: 0.1.0
  description: Structured SEL billing API. Invoice documents are JSON; PDF generation is client-side only.
servers:
  - url: https://api.example.invalid
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        '200': { description: Service is alive }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        '200': { description: Service readiness }
  /v1/meta/capabilities:
    get:
      operationId: capabilities
      responses:
        '200': { description: Protocol capabilities }
  /v1/catalog/products:
    get:
      operationId: listCatalogProducts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active commercial products
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogProduct' } } } }
  /v1/catalog/tariffs:
    get:
      operationId: listCatalogTariffs
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Approved dated utility tariffs only
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogTariff' } } } }
  /v1/catalog/tax-profiles:
    get:
      operationId: listCatalogTaxProfiles
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Approved dated tax profiles only
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogTaxProfile' } } } }
  /v1/catalog/fx-rates:
    get:
      operationId: listCatalogFxRates
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Approved exchange rates only
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CatalogFxRate' } } } }
  /v1/devices/enroll:
    post:
      operationId: enrollDevice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrollDeviceRequest' } } } }
      responses:
        '201': { description: Device enrolled }
        '200': { description: Idempotent retry }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/devices/{id}/revoke:
    post:
      operationId: revokeDevice
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UuidPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Device revoked }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/offline-grants:
    post:
      operationId: createOfflineGrant
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOfflineGrantRequest' } } } }
      responses:
        '201': { description: Signed offline grant issued }
        '200': { description: Idempotent retry }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/customers:
    get:
      operationId: listCustomers
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Customer code returned by X-Next-Cursor }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [ACTIVE, ARCHIVED] } }
      responses:
        '200':
          description: Customers page; the legacy array response is preserved
          headers:
            X-Next-Cursor: { schema: { type: string }, description: Cursor for the next page when present }
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Customer' } } } }
    post:
      operationId: createCustomer
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCustomer' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '401': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/customers/{id}:
    get:
      operationId: getCustomer
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200': { description: Customer, content: { application/json: { schema: { $ref: '#/components/schemas/Customer' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: updateCustomer
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UuidPath' }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateCustomer' } } } }
      responses:
        '200': { description: Updated customer }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/billing/utility/preview:
    post:
      operationId: previewUtility
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillingRequest' } } } }
      responses:
        '200': { description: Two service lines, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillingResponse' } } } }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/billing/utility/issue:
    post:
      operationId: issueUtility
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillingRequest' } } } }
      responses:
        '201': { description: Central accepted, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillingResponse' } } } }
        '200': { description: Idempotent retry }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200': { description: Structured invoice, content: { application/json: { schema: { $ref: '#/components/schemas/UtilityBillingResponse' } } } }
  /v1/invoices/{id}/document-data:
    get:
      operationId: getInvoiceDocumentData
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200': { description: Client rendering data only, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentData' } } } }
  /v1/payments:
    post:
      operationId: recordPayment
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecordPaymentRequest' } } } }
      responses:
        '201': { description: Payment recorded }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/payments/{id}/allocate:
    post:
      operationId: allocatePayment
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UuidPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocations]
              properties:
                allocations:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/PaymentAllocation' }
      responses:
        '201': { description: Payment allocations recorded }
        '200': { description: Idempotent retry }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/receivables/{id}:
    get:
      operationId: getReceivable
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200': { description: Receivable balance projection }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/receivables/{id}/credit:
    post:
      operationId: createCreditNote
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UuidPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreditNoteRequest' }
      responses:
        '201': { description: Credit note recorded append-only }
        '200': { description: Idempotent retry }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/customers/{id}/statement:
    get:
      operationId: getCustomerStatement
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200': { description: Customer receivables statement }
  /v1/sync/push:
    post:
      operationId: syncPush
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Durable event results }
  /v1/sync/pull:
    get:
      operationId: syncPull
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Paged central changes }
  /v1/config/versions:
    get:
      operationId: configVersions
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Declarative update metadata }
  /v1/client-resources/manifest:
    get:
      operationId: clientResourcesManifest
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Signed declarative resource metadata only }
  /v1/sync/status:
    get:
      operationId: syncStatus
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Honest local/central synchronization status }
  /v1/solar/sales:
    post:
      operationId: createSolarSale
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateSolarSaleRequest' } } } }
      responses:
        '201': { description: One sale and one receivable }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/solar/contracts:
    post:
      operationId: createSolarContract
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateSolarContractRequest' } } } }
      responses:
        '201': { description: Persisted solar contract and exact installment schedule }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/solar/contracts/{id}/activate:
    post:
      operationId: activateSolarContract
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/UuidPath' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivateSolarContractRequest' } } } }
      responses:
        '200': { description: Exact installment schedule accepted }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/installment-plans/{id}:
    get:
      operationId: getInstallmentPlan
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidPath' }]
      responses:
        '200':
          description: Persisted installment plan with payment state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InstallmentPlan' }
        '404': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    UuidPath: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8 } }
  responses:
    Problem:
      description: Stable problem detail
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetails' } } }
  schemas:
    CatalogProduct:
      type: object
      required: [id, sku, product_type, label, price_reference, currency]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        product_type: { type: string }
        label: { type: string }
        price_reference: { type: string }
        currency: { type: string }
    CatalogTariff:
      type: object
      required: [id, service_code, customer_category, unit, unit_price, currency, effective_from, approval_ref]
      properties:
        id: { type: string, format: uuid }
        service_code: { type: string, enum: [ELECTRICITY, WATER] }
        customer_category: { type: string }
        unit: { type: string, enum: [KWH, M3] }
        unit_price: { type: string }
        currency: { type: string }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        approval_ref: { type: string }
    CatalogTaxProfile:
      type: object
      required: [id, service_code, jurisdiction, base, rate, source, effective_from]
      properties:
        id: { type: string, format: uuid }
        service_code: { type: string, enum: [ELECTRICITY, WATER] }
        jurisdiction: { type: string }
        base: { type: string }
        rate: { type: string }
        source: { type: string }
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
    CatalogFxRate:
      type: object
      required: [id, from_currency, to_currency, value, effective_from, source]
      properties:
        id: { type: string, format: uuid }
        from_currency: { type: string }
        to_currency: { type: string }
        value: { type: string }
        effective_from: { type: string, format: date }
        source: { type: string }
    Customer:
      type: object
      required: [id, organization_id, customer_code, legal_name, status, revision]
      properties:
        id: { type: string, format: uuid }
        organization_id: { type: string, format: uuid }
        customer_code: { type: string }
        legal_name: { type: string }
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        status: { type: string }
        revision: { type: integer, format: int64 }
    CreateCustomer:
      type: object
      required: [customer_code, legal_name]
      properties:
        customer_code: { type: string }
        legal_name: { type: string }
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
    EnrollDeviceRequest:
      type: object
      required: [device_id, public_key_id]
      properties:
        device_id: { type: string, format: uuid }
        public_key_id: { type: string, minLength: 1 }
    CreateOfflineGrantRequest:
      type: object
      required: [grant_id, user_id, device_id, scopes, limits, issued_at, expires_at, signature]
      properties:
        grant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        scopes: { type: object }
        limits: { type: object }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        signature: { type: string, minLength: 80 }
    UpdateCustomer:
      type: object
      properties:
        legal_name: { type: [string, 'null'] }
        address: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        status: { type: [string, 'null'], enum: [ACTIVE, ARCHIVED, null] }
    UtilityBillingRequest:
      type: object
      required: [customer_id, billing_period, electricity, water, water_zero_confirmed, currency, tariff_revision]
      properties:
        customer_id: { type: string, format: uuid }
        billing_period: { type: string, pattern: '^\\d{4}-(0[1-9]|1[0-2])$' }
        electricity: { $ref: '#/components/schemas/ServiceInput' }
        water: { $ref: '#/components/schemas/ServiceInput' }
        water_zero_confirmed: { type: boolean }
        currency: { type: string }
        tariff_revision: { type: string }
        due_date: { type: [string, 'null'], format: date }
    ServiceInput:
      type: object
      required: [quantity, unit]
      properties:
        quantity: { type: string, description: Decimal encoded as a JSON string }
        unit: { type: string, enum: [KWH, M3] }
    InvoiceLine:
      type: object
      required: [service_code, quantity, unit, subtotal, tax, total]
      properties:
        service_code: { type: string, enum: [ELECTRICITY, WATER] }
        quantity: { type: string }
        unit: { type: string }
        unit_price: { type: [string, 'null'] }
        subtotal: { type: string }
        tax: { type: string }
        total: { type: string }
    UtilityBillingResponse:
      type: object
      required: [invoice_id, receivable_id, status, currency, lines, subtotal, tax, total, snapshot_sha256]
      properties:
        invoice_id: { type: string, format: uuid }
        receivable_id: { type: [string, 'null'], format: uuid }
        invoice_number: { type: [string, 'null'] }
        status: { type: string }
        currency: { type: string }
        lines: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/InvoiceLine' } }
        subtotal: { type: string }
        tax: { type: string }
        total: { type: string }
        snapshot_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
    PaymentAllocation:
      type: object
      required: [receivable_id, amount]
      properties:
        receivable_id: { type: string, format: uuid }
        amount: { type: string }
    RecordPaymentRequest:
      type: object
      required: [customer_id, received_amount, currency, method, occurred_at, allocations]
      properties:
        customer_id: { type: string, format: uuid }
        received_amount: { type: string }
        currency: { type: string }
        method: { type: string }
        occurred_at: { type: string, format: date-time }
        allocations: { type: array, items: { $ref: '#/components/schemas/PaymentAllocation' } }
    CreditNoteRequest:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: string, description: Positive Decimal amount in the receivable currency }
        reason: { type: string, minLength: 1 }
    CreateSolarSaleRequest:
      type: object
      required: [customer_id, product_code, principal, currency, terms_revision]
      properties:
        customer_id: { type: string, format: uuid }
        product_code: { type: string }
        principal: { type: string }
        currency: { type: string }
        terms_revision: { type: string }
    ActivateSolarContractRequest:
      type: object
      required: [sale_id, receivable_id, schedule, currency, approved_terms_revision]
      properties:
        sale_id: { type: string, format: uuid }
        receivable_id: { type: string, format: uuid }
        currency: { type: string }
        approved_terms_revision: { type: string }
        schedule:
          type: array
          minItems: 1
          items:
            type: object
            required: [sequence, due_date, amount]
            properties:
              sequence: { type: integer, minimum: 1 }
              due_date: { type: string, format: date }
              amount: { type: string }
    InstallmentPlan:
      type: object
      required: [id, receivable_id, contract_id, customer_id, principal, paid, remaining, overdue_amount, currency, start_date, stored_status, terms_snapshot, schedule]
      properties:
        id: { type: string, format: uuid }
        receivable_id: { type: string, format: uuid }
        contract_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        principal: { type: string }
        paid: { type: string }
        remaining: { type: string }
        overdue_amount: { type: string }
        currency: { type: string }
        start_date: { type: string, format: date }
        stored_status: { type: string }
        terms_snapshot: { type: object }
        schedule:
          type: array
          items:
            type: object
            required: [id, sequence, due_date, amount_due, paid, remaining, stored_status, status, overdue]
            properties:
              id: { type: string, format: uuid }
              sequence: { type: integer }
              due_date: { type: string, format: date }
              amount_due: { type: string }
              paid: { type: string }
              remaining: { type: string }
              stored_status: { type: string }
              status: { type: string, enum: [OPEN, OVERDUE, PAID] }
              overdue: { type: boolean }
    DocumentData:
      type: object
      required: [document_schema_version, template_version, document_reference, invoice, qr_internal_reference, origin]
      properties:
        document_schema_version: { type: integer }
        template_version: { type: string }
        document_reference: { type: string }
        invoice: { $ref: '#/components/schemas/UtilityBillingResponse' }
        qr_internal_reference: { type: string }
        origin: { type: string }
    ProblemDetails:
      type: object
      required: [type, title, status, code, detail, request_id]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        request_id: { type: string }

