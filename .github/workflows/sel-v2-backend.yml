name: SEL V2 Backend

on:
  pull_request:
    paths:
      - 'v2/**'
      - 'Docs/SEL_V2_BACKEND/**'
      - 'CODEX_SEL_V2_BACKEND_START_HERE.md'
      - '.github/workflows/sel-v2-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sel
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sel_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sel -d sel_v2_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v2 -> target
      - name: Install PostgreSQL backup and restore client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --silent --show-error --location https://www.postgresql.org/media/keys/ACCC4CF8.asc |
            sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          OS_CODENAME=$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${OS_CODENAME}-pgdg main" |
            sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          pg_dump --version | grep --extended-regexp --quiet ' 16\.'
          pg_restore --version | grep --extended-regexp --quiet ' 16\.'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: PostgreSQL persistence and transaction tests
        env:
          TEST_DATABASE_URL: postgres://sel:postgres@127.0.0.1:5432/sel_v2_test
        run: cargo test --workspace -- --ignored

