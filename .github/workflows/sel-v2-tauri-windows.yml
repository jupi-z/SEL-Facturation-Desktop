name: SEL V2 Tauri Windows client

on:
  pull_request:
    branches: [main]
    paths:
      - 'v2/windows-app/**'
      - 'v2/crates/sel-local/**'
      - 'v2/crates/sel-storage/**'
      - 'v2/migrations/sqlite/**'
      - 'tests/test_v2_tauri_client.py'
      - '.github/workflows/sel-v2-tauri-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tauri-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/windows-app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test Windows client and catalog contracts
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_v2_tauri_client.py

      - name: Install locked frontend dependencies
        working-directory: v2/windows-app
        run: npm ci

      - name: Capture desktop views against the Figma frame size
        run: |
          python -m pip install playwright
          python -m playwright install chromium
          python v2/windows-app/scripts/visual_review.py

      - name: Upload synthetic visual review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SEL-V2-Figma-Desktop-Review-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: artifacts/phase7-visual/*.png

      - name: Compile the local Rust agent
        run: cargo build --manifest-path v2/Cargo.toml -p sel-local --release --target x86_64-pc-windows-msvc

      - name: Package the local agent into Tauri resources
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'v2/target/x86_64-pc-windows-msvc/release/sel-local.exe'
          $destination = Join-Path $PWD 'v2/windows-app/src-tauri/resources/sel-local.exe'
          if (-not (Test-Path -LiteralPath $source)) { throw 'The Windows sel-local binary was not produced.' }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force

      - name: Build the React client
        working-directory: v2/windows-app
        run: npm run build

      - name: Test native session and central admin route allowlist
        run: cargo test --manifest-path v2/windows-app/src-tauri/Cargo.toml --lib --target x86_64-pc-windows-msvc

      - name: Build MSI and NSIS setup
        working-directory: v2/windows-app
        run: npm run tauri -- build --bundles msi,nsis

      - name: Upload unsigned Windows candidate
        uses: actions/upload-artifact@v4
        with:
          name: SEL-V2-Tauri-Windows-${{ github.run_number }}
          if-no-files-found: error
          path: |
            v2/windows-app/src-tauri/target/release/bundle/msi/*.msi
            v2/windows-app/src-tauri/target/release/bundle/nsis/*.exe
