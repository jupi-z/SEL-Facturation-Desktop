name: Build Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements*.txt'
      - 'templates/**'
      - 'static/**'
      - 'packaging/**'
      - 'tests/**'
      - '.github/workflows/windows.yml'
jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Build portable Windows EXE
        run: pyinstaller --clean --noconfirm --onefile --noconsole --name SEL-Facturation --add-data "templates;templates" --add-data "static;static" desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: SEL-Facturation-EXE
          path: dist/SEL-Facturation.exe
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler unavailable" }
          & $iscc packaging\SEL-Facturation.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SEL-Facturation-Setup
          path: dist/installer/*.exe
