name: Build Windows Desktop
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier une release après validation de la version et de la recette'
        required: true
        default: false
        type: boolean
      release_tag:
        description: 'Tag de release (la version numérique doit correspondre à version.py)'
        required: true
        default: 'v0.3.1-rc1'
        type: string
      sign_release:
        description: 'Signer les artefacts avec le certificat Authenticode SEL configuré dans les secrets GitHub'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'scripts/**', 'Docs/**', 'tests/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'scripts/**', 'Docs/**', 'tests/**', '.github/workflows/windows.yml']
permissions:
  contents: write
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Verify Windows desktop dependencies
        run: python -c "import webview, clr; from webview import FileDialog; print('Desktop runtime import OK')"
      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm --onefile --noconsole --name SEL-Facturation --icon packaging\sel-facturation.ico --add-data "templates;templates" --add-data "static;static" --hidden-import clr --collect-all webview desktop.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          & $iscc packaging\SEL-Facturation.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Install WiX Toolset 4
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          wix extension add -g WixToolset.Bal.wixext/4.0.5
          wix extension add -g WixToolset.Util.wixext/4.0.5
      - name: Compile MSI and autonomous bootstrapper
        shell: pwsh
        run: |
          $versionLine = Get-Content version.py | Select-String 'APP_VERSION'
          if ($versionLine -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'APP_VERSION introuvable' }
          $version = $Matches[1]
          New-Item -ItemType Directory -Force -Path build\webview2, dist\installer | Out-Null
          $webview = (Resolve-Path build\webview2).Path + '\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
          wix build -arch x64 packaging\wix\Product.wxs -d ProductVersion=$version -d ExePath="$((Resolve-Path dist\SEL-Facturation.exe).Path)" -o dist\installer\SEL-Facturation.msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX MSI build failed' }
          wix build -arch x64 packaging\bundle\Bundle.wxs -ext WixToolset.Bal.wixext -ext WixToolset.Util.wixext -d ProductVersion=$version -d MsiPath="$((Resolve-Path dist\installer\SEL-Facturation.msi).Path)" -d WebView2Installer=$webview -o "dist\installer\SEL-Facturation-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'WiX bootstrapper build failed' }
          $manifest = 'dist\installer\update.json'
          $setupAsset = (Resolve-Path "dist\installer\SEL-Facturation-Setup-$version.exe").Path
          $tag = '${{ inputs.release_tag }}'
          $manifestData = [ordered]@{
            schema = 1
            version = $version
            url = "https://github.com/${{ github.repository }}/releases/download/$tag/SEL-Facturation-Setup-$version.exe"
            sha256 = (Get-FileHash $setupAsset -Algorithm SHA256).Hash.ToLowerInvariant()
            size = (Get-Item $setupAsset).Length
            published_at = (Get-Date).ToUniversalTime().ToString('o')
            release_notes = 'Mise à jour SEL Facturation Desktop.'
          }
          [IO.File]::WriteAllText($manifest, ($manifestData | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - name: Smoke-test in-place MSI upgrade and data preservation
        shell: pwsh
        run: |
          $versionLine = Get-Content version.py | Select-String 'APP_VERSION'
          if ($versionLine -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'APP_VERSION introuvable' }
          $version = $Matches[1]
          $oldMsi = Join-Path $env:RUNNER_TEMP 'SEL-Facturation-previous.msi'
          $setup = (Resolve-Path "dist\installer\SEL-Facturation-Setup-$version.exe").Path
          $oldExe = (Resolve-Path 'dist\SEL-Facturation.exe').Path
          wix build -arch x64 packaging\wix\Product.wxs -d ProductVersion=0.3.0 -d ExePath="$oldExe" -o $oldMsi
          if ($LASTEXITCODE -ne 0) { throw 'Previous-version MSI build failed' }

          $dataHome = Join-Path $env:LOCALAPPDATA 'SEL Facturation'
          $sentinel = Join-Path $dataHome 'upgrade-sentinel.txt'
          New-Item -ItemType Directory -Force -Path $dataHome | Out-Null
          Set-Content -Path $sentinel -Value 'must-survive-upgrade' -Encoding UTF8
          $env:SEL_DATA_DIR = $dataHome
          $seedScript = @'
          import db
          db.initialize()
          c = db.connect()
          c.execute("INSERT INTO clients(code,name,address,meter_number) VALUES(?,?,?,?)", ("SEL-C-UPGRADE", "Client Upgrade", "Kolwezi", "M-UPDATE"))
          client_id = c.execute("SELECT id FROM clients WHERE code='SEL-C-UPGRADE'").fetchone()[0]
          c.execute("INSERT INTO invoices(number,client_id,billing_period,issue_date,client_snapshot,company_snapshot,calc_snapshot) VALUES(?,?,?,?,?,?,?)", ("SEL-2026-000001", client_id, "2026-09", "2026-09-30", "client-snapshot-v1", "company-snapshot-v1", "calc-snapshot-v1"))
          invoice_id = c.execute("SELECT id FROM invoices WHERE number='SEL-2026-000001'").fetchone()[0]
          c.execute("INSERT INTO payments(invoice_id,amount,method,paid_on) VALUES(?,?,?,?)", (invoice_id, "1250", "CASH", "2026-10-01"))
          c.commit()
          c.close()
          '@
          python -c $seedScript
          if ($LASTEXITCODE -ne 0) { throw 'Representative SQLite data setup failed' }
          Remove-Item Env:SEL_DATA_DIR
          $install = Start-Process msiexec.exe -ArgumentList '/i', $oldMsi, '/qn', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Previous-version MSI install failed: $($install.ExitCode)" }
          $install = Start-Process $setup -ArgumentList '/quiet', '/norestart' -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) { throw "Upgrade bootstrapper install failed: $($install.ExitCode)" }
          if (-not (Test-Path $sentinel)) { throw 'Persistent data sentinel was lost during upgrade' }
          $env:SEL_DATA_DIR = $dataHome
          $verifyScript = @'
          import db
          c = db.connect()
          assert c.execute("PRAGMA integrity_check").fetchone()[0] == "ok"
          client = c.execute("SELECT name FROM clients WHERE code='SEL-C-UPGRADE'").fetchone()
          invoice = c.execute("SELECT client_snapshot,company_snapshot,calc_snapshot FROM invoices WHERE number='SEL-2026-000001'").fetchone()
          payment = c.execute("SELECT amount FROM payments WHERE invoice_id=(SELECT id FROM invoices WHERE number='SEL-2026-000001')").fetchone()
          assert client[0] == "Client Upgrade"
          assert tuple(invoice) == ("client-snapshot-v1", "company-snapshot-v1", "calc-snapshot-v1")
          assert payment[0] == "1250"
          c.close()
          '@
          python -c $verifyScript
          if ($LASTEXITCODE -ne 0) { throw 'Representative SQLite data validation failed after upgrade' }
          Remove-Item Env:SEL_DATA_DIR

          $entries = @(
            Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
            Get-ItemProperty 'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue
          ) | Where-Object { $_.DisplayName -eq 'SEL Facturation' -and $_.SystemComponent -ne 1 }
          if (@($entries).Count -ne 1) { throw "Expected exactly one SEL Facturation installation, found $(@($entries).Count)" }
      - name: Sign Windows artifacts
        if: github.event_name == 'workflow_dispatch' && inputs.sign_release == true
        shell: pwsh
        env:
          SEL_CODESIGN_PFX_BASE64: ${{ secrets.SEL_CODESIGN_PFX_BASE64 }}
          SEL_CODESIGN_PFX_PASSWORD: ${{ secrets.SEL_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SEL_CODESIGN_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SEL_CODESIGN_PFX_PASSWORD)) {
            throw 'Secrets SEL_CODESIGN_PFX_BASE64 et SEL_CODESIGN_PFX_PASSWORD requis pour une release signée.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'sel-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SEL_CODESIGN_PFX_BASE64))
          $signtool = Get-ChildItem "$env:ProgramFiles\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'SignTool Windows SDK introuvable.' }
          $versionLine = Get-Content version.py | Select-String 'APP_VERSION'
          if ($versionLine -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'APP_VERSION introuvable' }
          $version = $Matches[1]
          $artifacts = @('dist/SEL-Facturation.exe', 'dist/installer/SEL-Facturation.msi', "dist/installer/SEL-Facturation-Setup-$version.exe")
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) { throw "Artefact introuvable avant signature: $artifact" }
            & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:SEL_CODESIGN_PFX_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $artifact
            if ($LASTEXITCODE -ne 0) { throw "Signature échouée: $artifact" }
            $signature = Get-AuthenticodeSignature $artifact
            if ($signature.Status -ne 'Valid') { throw "Signature invalide après signature: $artifact ($($signature.Status))" }
          }
          Remove-Item -LiteralPath $pfx -Force
      - name: Publish private GitHub prerelease without overwriting
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_SIGNED: ${{ inputs.sign_release }}
        run: |
          if ($env:PUBLISH_SIGNED -ne 'true') { throw 'Publication bloquée: activez sign_release pour publier uniquement des artefacts signés.' }
          $versionLine = Get-Content version.py | Select-String 'APP_VERSION'
          if ($versionLine -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'APP_VERSION introuvable' }
          $version = $Matches[1]
          foreach ($artifact in @('dist/SEL-Facturation.exe', 'dist/installer/SEL-Facturation.msi', "dist/installer/SEL-Facturation-Setup-$version.exe")) {
            $signature = Get-AuthenticodeSignature $artifact
            if ($signature.Status -ne 'Valid') { throw "Artefact non signé: $artifact" }
          }
          $tag = '${{ inputs.release_tag }}'
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid release tag: $tag" }
          $tagVersion = ($tag -replace '^v', '') -replace '-.*$', ''
          if ($tagVersion -ne $version) {
            throw "Release tag $tag must use the same numeric version as version.py ($version). Bump version.py before publishing an upgrade."
          }
          $existingTags = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -eq 0 -and $existingTags.Count -gt 0) { throw "Git tag $tag already exists; tags are immutable." }
          $existingReleases = @(gh release list --repo ${{ github.repository }} --limit 100 --json tagName | ConvertFrom-Json)
          $sameVersionRelease = $existingReleases | Where-Object {
            $candidate = ($_.tagName -replace '^v', '') -replace '-.*$', ''
            $candidate -eq $version
          }
          if ($sameVersionRelease) { throw "The same numeric version already has a release ($version); increment version.py before publishing an upgrade." }
          $exe = 'dist/SEL-Facturation.exe'
          $setup = "dist/installer/SEL-Facturation-Setup-$version.exe"
          $msi = 'dist/installer/SEL-Facturation.msi'
          $manifest = 'dist/installer/update.json'
          if (-not (Test-Path $exe) -or -not (Test-Path $setup) -or -not (Test-Path $msi) -or -not (Test-Path $manifest)) { throw "Missing Windows package" }
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; bump the application/installer version before publishing. Existing assets are never overwritten."
          } else {
            gh release create $tag $exe $setup $msi $manifest --target $env:GITHUB_SHA --prerelease --title 'SEL Facturation Desktop V0.3 - installateur Windows' --notes 'Préversion native Windows 10/11 : bootstrapper WebView2 hors ligne, MSI machine, Flask/SQLite local, facturation et PDF A4, sauvegardes. Tarifs à valider par SEL ; statut fiscal à vérifier avant émission officielle. Essai réel sur le PC cible indispensable.' --repo ${{ github.repository }}
          }
          if ($LASTEXITCODE -ne 0) { throw "Publication GitHub Releases failed" }
