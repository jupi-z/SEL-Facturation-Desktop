name: Build Windows Desktop
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publier une release après validation de la version et de la recette'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'tests/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'tests/**', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Verify Windows desktop dependencies
        run: python -c "import webview, clr; from webview import FileDialog; print('Desktop runtime import OK')"
      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm --onefile --noconsole --name SEL-Facturation --add-data "templates;templates" --add-data "static;static" --hidden-import clr --collect-all webview desktop.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          & $iscc packaging\SEL-Facturation.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Install WiX Toolset 4
        run: |
          dotnet tool install --global wix --version 4.0.5
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH
          wix extension add -g WixToolset.Bal.wixext/4.0.5
      - name: Compile MSI and autonomous bootstrapper
        shell: pwsh
        run: |
          $versionLine = Get-Content version.py | Select-String 'APP_VERSION'
          if ($versionLine -notmatch 'APP_VERSION\s*=\s*["'']([^"'']+)["'']') { throw 'APP_VERSION introuvable' }
          $version = $Matches[1]
          New-Item -ItemType Directory -Force -Path build\webview2, dist\installer | Out-Null
          $webview = (Resolve-Path build\webview2).Path + '\MicrosoftEdgeWebView2RuntimeInstallerX64.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
          wix build packaging\wix\Product.wxs -d ProductVersion=$version -d ExePath="$((Resolve-Path dist\SEL-Facturation.exe).Path)" -o dist\installer\SEL-Facturation.msi
          if ($LASTEXITCODE -ne 0) { throw 'WiX MSI build failed' }
          wix build packaging\bundle\Bundle.wxs -ext WixToolset.Bal.wixext -d ProductVersion=$version -d MsiPath="$((Resolve-Path dist\installer\SEL-Facturation.msi).Path)" -d WebView2Installer=$webview -o "dist\installer\SEL-Facturation-Setup-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'WiX bootstrapper build failed' }
      - name: Upload Windows packages
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: actions/upload-artifact@v4
        with:
          name: sel-windows-packages
          path: |
            dist/SEL-Facturation.exe
            dist/installer/SEL-Facturation-Setup-0.3.0.exe
            dist/installer/SEL-Facturation.msi
          if-no-files-found: error

  publish-release:
    needs: test-build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows packages
        uses: actions/download-artifact@v4
        with:
          name: sel-windows-packages
          path: dist
      - name: Publish private GitHub prerelease without overwriting
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.3.0-rc1'
          $exe = 'dist/SEL-Facturation.exe'
          $setup = 'dist/installer/SEL-Facturation-Setup-0.3.0.exe'
          if (-not (Test-Path $exe) -or -not (Test-Path $setup)) { throw "Missing Windows binary" }
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; bump the application/installer version before publishing. Existing assets are never overwritten."
          } else {
            gh release create $tag $exe $setup --prerelease --title 'SEL Facturation Desktop V0.3 - installateur Windows' --notes 'Préversion native Windows 10/11 : bootstrapper WebView2, MSI par utilisateur, Flask/SQLite local, facturation et PDF A4, sauvegardes. Tarifs à valider par SEL ; statut fiscal à vérifier avant émission officielle. Essai réel sur le PC cible indispensable.' --repo ${{ github.repository }}
          }
          if ($LASTEXITCODE -ne 0) { throw "Publication GitHub Releases failed" }
