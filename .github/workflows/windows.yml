name: Build Windows Desktop
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'tests/**', '.github/workflows/windows.yml']
permissions:
  contents: write
jobs:
  test-build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Unit and HTTP tests
        run: python -m pytest -q
      - name: Build Windows EXE
        run: pyinstaller --clean --noconfirm --onefile --noconsole --name SEL-Facturation --add-data "templates;templates" --add-data "static;static" desktop.py
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler unavailable: $iscc" }
          & $iscc packaging\SEL-Facturation.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: Publish private GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.1.0-rc1'
          $exe = 'dist/SEL-Facturation.exe'
          $setup = 'dist/installer/SEL-Facturation-Setup-1.0.0.exe'
          if (-not (Test-Path $exe) -or -not (Test-Path $setup)) { throw "Missing Windows binary" }
          gh release view $tag --repo ${{ github.repository }} 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $setup --clobber --repo ${{ github.repository }}
          } else {
            gh release create $tag $exe $setup --prerelease --title 'SEL Facturation Desktop V1 - pilote' --notes 'Version pilote locale : application Flask/SQLite, facturation et impression A4. Documents non authentifiés DGI ; tarifs à valider. Tester sur le PC de SEL avant tout usage réel.' --repo ${{ github.repository }}
          }
          if ($LASTEXITCODE -ne 0) { throw "Publication GitHub Releases failed" }
