name: SEL legacy regression tests (packaging retired)

on:
  push:
    branches: [main]
    paths: ['*.py', 'safeupdate_*.py', 'tools/**', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'tests/**', 'Docs/SEL_SAFEUPDATE_V1/**', '.github/workflows/windows.yml']
  pull_request:
    branches: [main]
    paths: ['*.py', 'safeupdate_*.py', 'tools/**', 'requirements*.txt', 'templates/**', 'static/**', 'packaging/**', 'tests/**', 'Docs/SEL_SAFEUPDATE_V1/**', 'Docs/SEL_RELEASE_GATE_V1/**', 'CODEX_RELEASE_GATE_START_HERE.md', '.github/workflows/windows.yml']

permissions:
  contents: read

jobs:
  legacy-regression-tests:
    name: test-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-build.txt pytest
      - name: Run regression tests
        run: python -m pytest -q
