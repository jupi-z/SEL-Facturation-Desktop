name: Import SEL source archive
on:
  push:
    branches: [main]
    paths: ['bundle/source.tar.xz']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify archive and import files
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f bundle/source.tar.xz ]; then
            echo "No archive to import"; exit 0
          fi
          echo "de7dc277018661701c8968fd4f9ff9a74565558cc659e759390247a1e45eeba5  bundle/source.tar.xz" | sha256sum --check
          tar -xJf bundle/source.tar.xz
          rm -rf bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import full SEL Facturation Desktop source"
            git push
          fi
