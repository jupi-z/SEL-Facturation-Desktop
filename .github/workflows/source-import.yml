name: Import project sources
on:
  push:
    branches: [main]
    paths:
      - "bundle/part4.b64"
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack verified source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f bundle/part4.b64 || exit 0
          cat bundle/part{1..4}.b64 | base64 --decode | tar -xJf -
          rm -rf bundle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "feat: import SEL desktop invoicing source"
            git push
          fi
